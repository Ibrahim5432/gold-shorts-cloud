name: Daily Gold Shorts Cloud Publisher (Turkey & Syria)

on:
  # يتم التشغيل الدقيق عبر cron-job.org (12:00 تركيا، 13:00 سوريا، 13:25 و14:25 تعويض) بدون تأخير مؤقت GitHub
  workflow_dispatch:
    inputs:
      country:
        description: 'اختر الفيديو المراد نشره الآن (auto / both / turkey / syria / turkey_tiktok / syria_tiktok / tiktok_only / check)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - both
          - turkey
          - syria
          - turkey_tiktok
          - syria_tiktok
          - tiktok_only
          - check

permissions:
  contents: write

concurrency:
  group: gold-shorts-publisher
  cancel-in-progress: false

jobs:
  publish_gold_shorts:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync Latest Published History & Set Timezone
        shell: pwsh
        run: |
          git pull --ff-only origin main
          tzutil /s "Turkey Standard Time"

      - name: Check if Publishing is Needed
        id: check_needed
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNTRY: ${{ github.event.inputs.country }}
          HAS_TS: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $hasTs = -not [string]::IsNullOrWhiteSpace($env:HAS_TS)
          "has_ts=$($hasTs.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_COUNTRY -ne "auto") {
            $mc = $env:MANUAL_COUNTRY
            $needYt = ($mc -in @("both", "turkey", "syria"))
            $needTt = ($mc -in @("both", "turkey", "syria", "turkey_tiktok", "syria_tiktok", "tiktok_only", "check"))
            Write-Host "🔧 Manual dispatch ($mc): need_yt=$needYt, need_tt=$needTt, has_ts=$hasTs"
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "need_yt=$($needYt.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "need_tt=$($needTt.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $now = Get-Date
          $today = $now.ToString("yyyy-MM-dd")
          $hour = $now.Hour
          $trYt = $false; $trTt = $false
          $syYt = $false; $syTt = $false
          if (Test-Path "published_history.json") {
            try {
              $hist = Get-Content "published_history.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($hist.PSObject.Properties.Name -contains $today) {
                $d = $hist.$today
                $trYt = if ($d.PSObject.Properties.Name -contains "turkey_yt") { [bool]$d.turkey_yt } else { [bool]$d.turkey }
                $trTt = if ($d.PSObject.Properties.Name -contains "turkey_tt") { [bool]$d.turkey_tt } else { [bool]$d.turkey }
                $syYt = if ($d.PSObject.Properties.Name -contains "syria_yt")  { [bool]$d.syria_yt }  else { [bool]$d.syria }
                $syTt = if ($d.PSObject.Properties.Name -contains "syria_tt")  { [bool]$d.syria_tt }  else { [bool]$d.syria }
              }
            } catch {}
          }
          $needYt = (($hour -ge 12) -and (-not $trYt)) -or (($hour -ge 13) -and (-not $syYt))
          $needTt = (($hour -ge 12) -and (-not $trTt)) -or (($hour -ge 13) -and (-not $syTt))
          if ($needYt -or $needTt) {
            Write-Host "✅ Publishing needed ($today Hour=$hour): need_yt=$needYt (TR=$trYt, SY=$syYt) | need_tt=$needTt (TR=$trTt, SY=$syTt)"
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "need_yt=$($needYt.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "need_tt=$($needTt.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "⏭️ Already published for current window ($today Hour=$hour). Skipping."
            "should_run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "need_yt=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "need_tt=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Connect Tailscale to Android Phone Bridge
        if: steps.check_needed.outputs.should_run == 'true' && steps.check_needed.outputs.need_tt == 'true' && steps.check_needed.outputs.has_ts == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Android Phone Proxy Readiness
        id: phone_probe
        if: steps.check_needed.outputs.should_run == 'true'
        shell: pwsh
        env:
          NEED_YT: ${{ steps.check_needed.outputs.need_yt }}
          NEED_TT: ${{ steps.check_needed.outputs.need_tt }}
          MANUAL_COUNTRY: ${{ github.event.inputs.country }}
          TIKTOK_PROXY_SERVER: ${{ secrets.TIKTOK_PROXY_SERVER }}
        run: |
          $phoneOnline = $false
          if ($env:NEED_TT -eq "true" -and -not [string]::IsNullOrWhiteSpace($env:TIKTOK_PROXY_SERVER)) {
            $srv = $env:TIKTOK_PROXY_SERVER -replace '^https?://', ''
            $parts = $srv.Split(':')
            $h = $parts[0]
            $p = if ($parts.Length -gt 1) { [int]$parts[1] } else { 8080 }
            for ($i = 0; $i -lt 2; $i++) {
              try {
                $client = New-Object System.Net.Sockets.TcpClient
                $iar = $client.BeginConnect($h, $p, $null, $null)
                $ok = $iar.AsyncWaitHandle.WaitOne(6000, $false)
                if ($ok -and $client.Connected) {
                  $phoneOnline = $true
                  $client.EndConnect($iar)
                  $client.Close()
                  break
                }
                $client.Close()
              } catch {}
              Start-Sleep -Seconds 2
            }
          }
          $needSetup = ($env:NEED_YT -eq "true") -or ($env:MANUAL_COUNTRY -eq "check") -or $phoneOnline
          Write-Host "📡 phone_online=$phoneOnline | need_setup=$needSetup (need_yt=$env:NEED_YT)"
          "phone_online=$($phoneOnline.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "need_setup=$($needSetup.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Python 3.12
        if: steps.check_needed.outputs.should_run == 'true' && steps.phone_probe.outputs.need_setup == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_needed.outputs.should_run == 'true' && steps.phone_probe.outputs.need_setup == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install numpy lxml imageio-ffmpeg requests beautifulsoup4 pillow arabic-reshaper python-bidi pyyaml google-api-python-client google-auth-oauthlib google-auth-httplib2 playwright
          playwright install chromium

      - name: Restore Encrypted Credentials & Browser Sessions
        if: steps.check_needed.outputs.should_run == 'true' && steps.phone_probe.outputs.need_setup == 'true'
        shell: pwsh
        env:
          CLIENT_SECRETS_B64: ${{ secrets.CLIENT_SECRETS_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          CLOUD_AUTH_STATE_B64: ${{ secrets.CLOUD_AUTH_STATE_B64 }}
        run: |
          if ($env:CLIENT_SECRETS_B64) {
            [IO.File]::WriteAllBytes("client_secrets.json", [Convert]::FromBase64String($env:CLIENT_SECRETS_B64))
          }
          if ($env:YOUTUBE_TOKEN_B64) {
            [IO.File]::WriteAllBytes("youtube_token.json", [Convert]::FromBase64String($env:YOUTUBE_TOKEN_B64))
          }
          if ($env:CLOUD_AUTH_STATE_B64) {
            [IO.File]::WriteAllBytes("cloud_auth_state.json", [Convert]::FromBase64String($env:CLOUD_AUTH_STATE_B64))
          }

      - name: Publish YouTube Shorts (Direct GitHub Internet)
        if: steps.check_needed.outputs.should_run == 'true' && steps.check_needed.outputs.need_yt == 'true'
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNTRY: ${{ github.event.inputs.country }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_COUNTRY -ne "auto") {
            if ($env:MANUAL_COUNTRY -eq "turkey" -or $env:MANUAL_COUNTRY -eq "both") {
              Write-Host "🇹🇷▶ Running Turkey YouTube + Telegram..."
              python make_gold_short.py --platform youtube
            }
            if ($env:MANUAL_COUNTRY -eq "syria" -or $env:MANUAL_COUNTRY -eq "both") {
              Write-Host "🇸🇾▶ Running Syria YouTube + Telegram..."
              python make_syria_gold_short.py --platform youtube
            }
          } else {
            Write-Host "🤖▶ Running Smart Daily YouTube + Telegram..."
            python run_all_daily.py --platform youtube
          }

      - name: Publish TikTok Videos via Android Phone Proxy
        if: steps.check_needed.outputs.should_run == 'true' && steps.check_needed.outputs.need_tt == 'true' && (steps.phone_probe.outputs.phone_online == 'true' || github.event.inputs.country == 'check')
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNTRY: ${{ github.event.inputs.country }}
          TIKTOK_PROXY_SERVER: ${{ secrets.TIKTOK_PROXY_SERVER }}
          TIKTOK_PROXY_USERNAME: ${{ secrets.TIKTOK_PROXY_USERNAME }}
          TIKTOK_PROXY_PASSWORD: ${{ secrets.TIKTOK_PROXY_PASSWORD }}
          TIKTOK_REQUIRE_PROXY: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if ($env:MANUAL_COUNTRY -eq "check") {
            Write-Host "🔍 Checking Android phone proxy + TikTok Studio session (no publishing)..."
            python cloud_check.py
          } elseif ($env:MANUAL_COUNTRY -eq "turkey_tiktok" -or $env:MANUAL_COUNTRY -eq "turkey") {
            Write-Host "🇹🇷🎵 Running Turkey TikTok via Phone Proxy..."
            python make_gold_short.py --platform tiktok
          } elseif ($env:MANUAL_COUNTRY -eq "syria_tiktok" -or $env:MANUAL_COUNTRY -eq "syria") {
            Write-Host "🇸🇾🎵 Running Syria TikTok via Phone Proxy..."
            python make_syria_gold_short.py --platform tiktok
          } elseif ($env:MANUAL_COUNTRY -eq "tiktok_only" -or $env:MANUAL_COUNTRY -eq "both") {
            Write-Host "🎵 Running Both Countries TikTok via Phone Proxy (--force)..."
            python run_all_daily.py --platform tiktok --force
          } else {
            Write-Host "🤖🎵 Running Smart Daily TikTok via Phone Proxy..."
            python run_all_daily.py --platform tiktok
          }

      - name: Upload Proof Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: |
            proof/
            temp/*.png
          if-no-files-found: ignore

      - name: Save Published History to Cloud Repository
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "published_history.json") {
            git config user.name "GoldCloudBot"
            git config user.email "bot@users.noreply.github.com"
            git add published_history.json
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Update daily published_history.json"
              git pull --rebase origin main
              git push origin main
            }
          }
