name: Daily Gold Shorts Cloud Publisher (Turkey & Syria)

on:
  schedule:
    # نبضات متقاربة كل 5 دقائق من 12:00 ظهراً حتى 03:55 عصراً بتوقيت تركيا وسوريا (09:00 - 12:55 UTC)
    # للقضاء نهائياً على أي تأخير من مؤقت GitHub الداخلي (مع فحص ذكي فوري يتجاوز التشغيل خلال ثانية واحدة إذا تم النشر)
    - cron: '*/5 9-12 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'اختر الفيديو المراد نشره الآن (auto / turkey / syria / both)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - both
          - turkey
          - syria
          - check

permissions:
  contents: write

concurrency:
  group: gold-shorts-publisher
  cancel-in-progress: false

jobs:
  publish_gold_shorts:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Timezone to UTC+3 (Turkey/Syria)
        shell: pwsh
        run: |
          tzutil /s "Turkey Standard Time"

      - name: Check if Publishing is Needed
        id: check_needed
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNTRY: ${{ github.event.inputs.country }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_COUNTRY -ne "auto") {
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $now = Get-Date
          $today = $now.ToString("yyyy-MM-dd")
          $hour = $now.Hour
          $trDone = $false
          $syDone = $false
          if (Test-Path "published_history.json") {
            try {
              $hist = Get-Content "published_history.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($hist.PSObject.Properties.Name -contains $today) {
                $trDone = [bool]$hist.$today.turkey
                $syDone = [bool]$hist.$today.syria
              }
            } catch {}
          }
          $needTr = ($hour -ge 12) -and (-not $trDone)
          $needSy = ($hour -ge 13) -and (-not $syDone)
          if ($needTr -or $needSy) {
            Write-Host "✅ Publishing needed: Turkey=$needTr, Syria=$needSy"
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "⏭️ Already published for current window ($today Hour=$hour, TR=$trDone, SY=$syDone). Skipping."
            "should_run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Setup Python 3.12
        if: steps.check_needed.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_needed.outputs.should_run == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install numpy lxml imageio-ffmpeg requests beautifulsoup4 pillow arabic-reshaper python-bidi pyyaml google-api-python-client google-auth-oauthlib google-auth-httplib2 playwright
          playwright install chromium

      - name: Restore Encrypted Credentials & Browser Sessions
        if: steps.check_needed.outputs.should_run == 'true'
        shell: pwsh
        env:
          CLIENT_SECRETS_B64: ${{ secrets.CLIENT_SECRETS_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          CLOUD_AUTH_STATE_B64: ${{ secrets.CLOUD_AUTH_STATE_B64 }}
        run: |
          if ($env:CLIENT_SECRETS_B64) {
            [IO.File]::WriteAllBytes("client_secrets.json", [Convert]::FromBase64String($env:CLIENT_SECRETS_B64))
          }
          if ($env:YOUTUBE_TOKEN_B64) {
            [IO.File]::WriteAllBytes("youtube_token.json", [Convert]::FromBase64String($env:YOUTUBE_TOKEN_B64))
          }
          if ($env:CLOUD_AUTH_STATE_B64) {
            [IO.File]::WriteAllBytes("cloud_auth_state.json", [Convert]::FromBase64String($env:CLOUD_AUTH_STATE_B64))
          }

      - name: Execute Daily Gold Video Generation & Multi-Platform Upload
        if: steps.check_needed.outputs.should_run == 'true'
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNTRY: ${{ github.event.inputs.country }}
        run: |
          if ($env:MANUAL_COUNTRY -eq "check") {
            Write-Host "🔍 Cloud login verification (no publishing)..."
            python cloud_check.py
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_COUNTRY -ne "auto") {
            if ($env:MANUAL_COUNTRY -eq "turkey" -or $env:MANUAL_COUNTRY -eq "both") {
              Write-Host "🇹🇷 Running Turkey Gold Shorts..."
              python make_gold_short.py
            }
            if ($env:MANUAL_COUNTRY -eq "syria" -or $env:MANUAL_COUNTRY -eq "both") {
              Write-Host "🇸🇾 Running Syria Gold Shorts..."
              python make_syria_gold_short.py
            }
          } else {
            Write-Host "🤖 Running Smart Daily Orchestrator (run_all_daily.py)..."
            python run_all_daily.py
          }

      - name: Upload Proof Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: |
            proof/
            temp/*.png
          if-no-files-found: ignore

      - name: Save Published History to Cloud Repository
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "published_history.json") {
            git config user.name "GoldCloudBot"
            git config user.email "bot@users.noreply.github.com"
            git add published_history.json
            git diff --staged --quiet || (git commit -m "Update daily published_history.json" && git push)
          }
